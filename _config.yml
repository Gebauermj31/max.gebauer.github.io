locale: en-US
title: Maximilian (Max) J. Gebauer
name: Maximilian (Max) J. Gebauer
description: Transdisciplinary researcher in philosophy of science, statistics, and sports analytics.
url: "https://max-gebauer.github.io"
baseurl: ""
repository: Max-Gebauer/max.gebauer.github.io
theme: null
email: gebauerm@sas.upenn.edu
github_username: Max-Gebauer
github_url: https://github.com/Max-Gebauer
linkedin_url: https://www.linkedin.com/in/maximilian-gebauer-6b2a33365/
penn_profile_url: https://philosophy.sas.upenn.edu/people/maximilian-gebauer

markdown: kramdown
highlighter: rouge
encoding: utf-8
permalink: pretty
strict_front_matter: true

include:
  - _pages
  - files

exclude:
  - .bundle
  - .git
  - .github
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CONTENT_GUIDE.md
  - THIRD_PARTY_NOTICES.md
  - node_modules
  - output
  - README.md
  - vendor

collections:
  projects:
    output: true
    permalink: /projects/:name/
  publications:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

author:
  name: Maximilian (Max) J. Gebauer
  email: gebauerm@sas.upenn.edu
  location: Philadelphia, Pennsylvania
  affiliation: University of Pennsylvania
  github: https://github.com/Max-Gebauer
  linkedin: https://www.linkedin.com/in/maximilian-gebauer-6b2a33365/
  penn_profile: https://philosophy.sas.upenn.edu/people/maximilian-gebauer

social:
  name: Maximilian (Max) J. Gebauer
  links:
    - https://github.com/Max-Gebauer
    - https://www.linkedin.com/in/maximilian-gebauer-6b2a33365/
    - https://philosophy.sas.upenn.edu/people/maximilian-gebauer

logo: /assets/images/mg-monogram.svg
og_image: /assets/images/social-card.svg
