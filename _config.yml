locale: en-US
title: Maximilian J. Gebauer
name: Maximilian J. Gebauer
description: Interdisciplinary researcher in philosophy of science, statistics, and data science.
url: ""
baseurl: ""
repository: Gebauermj31/max.gebauer.github.io
theme: null
email: gebauerm@sas.upenn.edu
github_username: Gebauermj31

markdown: kramdown
highlighter: rouge
encoding: utf-8
permalink: pretty
strict_front_matter: true

include:
  - _pages
  - files

exclude:
  - .bundle
  - .git
  - .github
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CONTENT_GUIDE.md
  - THIRD_PARTY_NOTICES.md
  - node_modules
  - output
  - README.md
  - vendor

collections:
  projects:
    output: true
    permalink: /projects/:name/
  publications:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

author:
  name: Maximilian J. Gebauer
  email: gebauerm@sas.upenn.edu
  location: Philadelphia, Pennsylvania
  affiliation: University of Pennsylvania
  github: https://github.com/Gebauermj31

social:
  name: Maximilian J. Gebauer
  links:
    - https://github.com/Gebauermj31

logo: /assets/images/mg-monogram.svg
og_image: /assets/images/social-card.svg
