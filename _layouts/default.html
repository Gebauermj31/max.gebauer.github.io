<!doctype html>
<html lang="{{ site.locale | default: 'en-US' }}" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <script>
      (function () {
        var saved = localStorage.getItem('mg-theme');
        document.documentElement.dataset.theme = saved || 'light';
      }());
    </script>
    {% seo %}
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body class="layout-{{ page.layout | default: 'page' }}">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include site-header.html %}
    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>
    {% include site-footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
