---
layout: default
---
<article class="page-shell cv-page">
  <header class="cv-header measure-wide">
    <div>
      <p class="eyebrow">Curriculum vitae</p>
      <h1>{{ page.title }}</h1>
      <p class="page-lede">Philadelphia · <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    </div>
    <a class="button" href="{{ '/files/maximilian-gebauer-cv.pdf' | relative_url }}">Download PDF</a>
  </header>
  <div class="cv-content measure-wide">
    {{ content }}
  </div>
</article>
