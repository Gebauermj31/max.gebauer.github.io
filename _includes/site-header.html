<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Maximilian (Max) J. Gebauer, home">
      <img src="{{ '/assets/images/mg-monogram.svg' | relative_url }}" alt="" width="42" height="42">
      <span>Maximilian (Max) J. Gebauer</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">Toggle navigation</span>
      <span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation.main %}
        {% assign item_url = item.url | relative_url %}
        <a href="{{ item_url }}"{% if page.url == item.url or page.section == item.title %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
        <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
      </button>
    </nav>
  </div>
</header>
