name: Build and validate site

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build with strict front matter
        run: bundle exec jekyll build --strict_front_matter
      - name: Check HTML, links, assets, privacy markers, and PDF
        run: bundle exec ruby scripts/check_site.rb
