<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">FAIR xwOBA baseball workflow</title>
  <desc id="description">Batted-ball, park, weather, and defensive features enter an XGBoost classifier. Its five outcome probabilities are combined into scalar expected weighted on-base average. Both outputs enter calibration and rolling validation, while the scalar prediction alone is residualized before Sprint Speed is joined for downstream analysis.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#5aa0ff"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#f4b64f"/>
    </marker>
  </defs>

  <rect width="1200" height="800" rx="28" fill="#101722"/>
  <text x="40" y="43" fill="#7eb5ff" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2.2">BASEBALL CONTACT-VALUE PIPELINE</text>
  <text x="40" y="78" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">From a batted ball to expected offensive value</text>

  <g fill="#17283e" stroke="#3c6da8" stroke-width="2">
    <rect x="40" y="105" width="340" height="130" rx="14"/>
    <rect x="430" y="105" width="340" height="130" rx="14"/>
    <rect x="820" y="105" width="340" height="130" rx="14"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="66" y="142" fill="#ffffff" font-size="20" font-weight="700">How the ball was hit</text>
    <text x="66" y="174" fill="#c5d2e3" font-size="15">exit velocity · launch angle</text>
    <text x="66" y="200" fill="#c5d2e3" font-size="15">spray direction · hang-time proxy</text>

    <text x="456" y="142" fill="#ffffff" font-size="20" font-weight="700">Where and when</text>
    <text x="456" y="174" fill="#c5d2e3" font-size="15">ballpark · roof · temperature</text>
    <text x="456" y="200" fill="#c5d2e3" font-size="15">field-relative wind · rule era</text>

    <text x="846" y="142" fill="#ffffff" font-size="20" font-weight="700">Defensive context</text>
    <text x="846" y="174" fill="#c5d2e3" font-size="15">pre-pitch infield and outfield</text>
    <text x="846" y="200" fill="#c5d2e3" font-size="15">alignment · context only</text>
  </g>

  <g fill="none" stroke="#5aa0ff" stroke-width="3">
    <path d="M210 235v28h390"/>
    <path d="M600 235v45"/>
    <path d="M990 235v28H600"/>
    <path d="M600 263v17" marker-end="url(#arrow-blue)"/>
  </g>

  <rect x="405" y="290" width="390" height="96" rx="48" fill="#075fd8"/>
  <text x="600" y="327" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">XGBoost classifier</text>
  <text x="600" y="352" text-anchor="middle" fill="#dceaff" font-family="Arial, sans-serif" font-size="14">learns outcome patterns from prior MLB seasons</text>
  <text x="600" y="373" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">NO SPRINT SPEED · NO PLAYER ID</text>

  <path d="M600 386v24H310v20" fill="none" stroke="#5aa0ff" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="60" y="430" width="500" height="120" rx="16" fill="#17283e" stroke="#3c6da8" stroke-width="2"/>
  <text x="88" y="468" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Five outcome probabilities</text>
  <text x="88" y="500" fill="#7eb5ff" font-family="monospace" font-size="15" font-weight="700">P(OUT) · P(1B) · P(2B) · P(3B) · P(HR)</text>
  <text x="88" y="528" fill="#c5d2e3" font-family="Arial, sans-serif" font-size="14">a complete outcome distribution for each batted ball</text>

  <path d="M560 490h90" fill="none" stroke="#5aa0ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="605" y="477" text-anchor="middle" fill="#7eb5ff" font-family="monospace" font-size="11" font-weight="700">WEIGHTED SUM</text>

  <rect x="650" y="430" width="490" height="120" rx="16" fill="#17283e" stroke="#3c6da8" stroke-width="2"/>
  <text x="678" y="468" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Scalar xwOBA</text>
  <text x="678" y="500" fill="#7eb5ff" font-family="monospace" font-size="15" font-weight="700">Σ P(OUTCOME) × OUTCOME WEIGHT</text>
  <text x="678" y="528" fill="#c5d2e3" font-family="Arial, sans-serif" font-size="14">one expected offensive-value number for the contact</text>

  <g fill="none" stroke="#5aa0ff" stroke-width="3">
    <path d="M310 550v90" marker-end="url(#arrow-blue)"/>
    <path d="M700 550v44H500v46" marker-end="url(#arrow-blue)"/>
  </g>
  <text x="326" y="596" fill="#7eb5ff" font-family="monospace" font-size="11" font-weight="700">PROBABILITIES</text>
  <text x="514" y="582" fill="#7eb5ff" font-family="monospace" font-size="11" font-weight="700">SCALAR</text>

  <rect x="40" y="640" width="520" height="120" rx="16" fill="#17283e" stroke="#3c6da8" stroke-width="2"/>
  <text x="68" y="678" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Calibrate + validate</text>
  <text x="68" y="708" fill="#c5d2e3" font-family="Arial, sans-serif" font-size="14">probability calibration · scalar calibration</text>
  <text x="68" y="734" fill="#7eb5ff" font-family="monospace" font-size="13" font-weight="700">ROLLING HELD-OUT MLB SEASONS · ACCURACY + CALIBRATION</text>

  <path d="M895 550v45H762v35" fill="none" stroke="#f4b64f" stroke-width="3" marker-end="url(#arrow-gold)"/>
  <text x="778" y="582" fill="#f4b64f" font-family="monospace" font-size="11" font-weight="700">POST-SCORE PATH</text>

  <rect x="620" y="630" width="285" height="130" rx="16" fill="#2c281d" stroke="#c58a2d" stroke-width="2"/>
  <text x="644" y="668" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Residualize each contact</text>
  <text x="644" y="700" fill="#f6d99d" font-family="Arial, sans-serif" font-size="14">observed wOBA value</text>
  <text x="644" y="723" fill="#f6d99d" font-family="Arial, sans-serif" font-size="14">− predicted xwOBA</text>
  <text x="644" y="746" fill="#c5d2e3" font-family="monospace" font-size="11">MODEL ERROR / REMAINING VALUE</text>

  <path d="M905 695h30" fill="none" stroke="#f4b64f" stroke-width="3" marker-end="url(#arrow-gold)"/>

  <rect x="935" y="630" width="225" height="130" rx="16" fill="#2c281d" stroke="#c58a2d" stroke-width="2"/>
  <text x="959" y="668" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Analyze residuals</text>
  <text x="959" y="700" fill="#f6d99d" font-family="Arial, sans-serif" font-size="14">join Sprint Speed</text>
  <text x="959" y="723" fill="#f6d99d" font-family="Arial, sans-serif" font-size="14">only after prediction</text>
  <text x="959" y="746" fill="#c5d2e3" font-family="monospace" font-size="9.5">ESTIMATE SPEED-ASSOCIATED VALUE</text>
</svg>
